{% extends 'base.html' %}

{% block title %}Study Materials{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-journal-bookmark-fill text-primary"></i> Study Materials</h2>
        <a href="/student_dashboard" class="btn btn-outline-secondary btn-sm px-3 rounded-pill glass-card">Back</a>
    </div>

    <div class="row g-4">
        {% for mat in materials %}
        <div class="col-md-6 col-lg-3">
            <div class="card glass-card glass-card-hover h-100 p-4 d-flex flex-column text-center">
                <div class="mb-3">
                    <i class="bi {{ mat.icon }}" style="font-size: 3rem;"></i>
                </div>
                <h5 class="fw-bold mb-2">{{ mat.title }}</h5>
                <p class="text-secondary small mb-3">{{ mat.type }} &bull; {{ mat.size }}</p>
                <div class="mt-auto">
                    <button class="btn btn-custom-primary w-100 rounded-pill">Download <i class="bi bi-download ms-1"></i></button>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center text-secondary py-5">
            <i class="bi bi-folder-x fs-1"></i>
            <p class="mt-3">No study materials available at the moment.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
