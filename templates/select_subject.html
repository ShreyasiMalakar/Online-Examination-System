{% extends 'base.html' %}

{% block title %}Select Subject{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-book-half text-primary"></i> Choose Subject</h2>
        <a href="/student_dashboard" class="btn btn-outline-secondary btn-sm px-3 rounded-pill glass-card">Back</a>
    </div>

    <div class="row g-4">
        {% for s in subjects %}
        <div class="col-md-6 col-lg-4">
            <div class="card glass-card glass-card-hover h-100 p-4 text-center">
                <div class="mb-3">
                    <div class="d-inline-flex bg-primary bg-opacity-10 text-primary rounded-circle p-3 mb-2">
                        <i class="bi bi-file-earmark-text fs-2"></i>
                    </div>
                </div>
                <h4 class="fw-bold mb-3">{{ s[0] }}</h4>
                <a href="/take_test_subject/{{ s[0] }}" class="btn btn-custom-primary rounded-pill w-100">Start Test <i class="bi bi-play-circle ms-1"></i></a>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center text-secondary py-5 glass-card">
            <i class="bi bi-hourglass-bottom fs-1"></i>
            <p class="mt-3">No subjects available currently.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
