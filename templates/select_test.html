{% extends 'base.html' %}

{% block title %}Select Test{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-file-earmark-check text-primary"></i> Available Tests</h2>
        <a href="/student_dashboard" class="btn btn-outline-secondary btn-sm px-3 rounded-pill glass-card">Back</a>
    </div>

    <div class="row g-4">
        {% for t in tests %}
        <div class="col-md-6 col-lg-4">
            <div class="card glass-card glass-card-hover h-100 p-4 text-center">
                <div class="mb-3">
                    <div class="d-inline-flex bg-success bg-opacity-10 text-success rounded-circle p-3 mb-2">
                        <i class="bi bi-journal-check fs-2"></i>
                    </div>
                </div>
                <h4 class="fw-bold mb-3">{{ t[1] }}</h4>
                <a href="/take_test/{{ t[0] }}" class="btn btn-outline-success border-2 rounded-pill w-100 fw-bold">Start</a>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center text-secondary py-5 glass-card">
            <i class="bi bi-hourglass-split fs-1"></i>
            <p class="mt-3">No tests available right now.</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
