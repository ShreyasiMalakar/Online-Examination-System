{% extends 'base.html' %}

{% block title %}Register - ExamPortal{% endblock %}

{% block content %}
<div class="container mt-5 pt-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-6">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-block bg-primary bg-opacity-10 rounded-circle p-3 mb-3">
                        <i class="bi bi-person-plus text-primary fs-1"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Create Account</h2>
                    <p class="text-secondary small">Join ExamPortal today</p>
                </div>
                
                <form action="/register" method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Create password" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-secondary">Role</label>
                            <select name="role" class="form-select">
                                <option value="student">Student</option>
                                <option value="teacher">Teacher</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-primary w-100 py-2 mt-4 mb-3">Sign Up</button>

                    <p class="text-center text-secondary small mb-0">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary">Sign in</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
