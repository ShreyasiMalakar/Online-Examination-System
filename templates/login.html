{% extends 'base.html' %}

{% block title %}Login - ExamPortal{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-block bg-primary bg-opacity-10 rounded-circle p-3 mb-3">
                        <i class="bi bi-box-arrow-in-right text-primary fs-1"></i>
                    </div>
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-secondary small">Please sign in to continue</p>
                </div>
                
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-medium text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-medium text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-custom-primary w-100 py-2 mb-3">Sign In</button>

                    <p class="text-center text-secondary small mb-0">
                        Don't have an account?
                        <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-primary">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
